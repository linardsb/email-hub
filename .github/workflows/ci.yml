name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a Dependabot rebase pushes a new
# commit to an open PR) instead of letting the stale run finish — this kills the
# rebase-cascade re-runs that dominate Actions-minute burn. Keyed by workflow +
# ref so different workflows never cross-cancel, and PR vs main runs stay
# independent. A cancelled final run merely delays auto-merge; it never mis-merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + types + security + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint (26 rule sets)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app/

      - name: Type check (pyright)
        run: uv run pyright app/

      - name: Security check (Bandit)
        run: uv run ruff check app/ --select=S --ignore=S311 --no-fix

      - name: .env.example drift gate
        run: make check-env-drift

      - name: Test
        run: uv run pytest -v -m "not integration" --cov=app --cov-report=term --cov-fail-under=88

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit --strict --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2026-196

  frontend:
    name: Frontend (lint + format + types + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: cd cms && pnpm install --frozen-lockfile

      - name: ESLint
        run: cd cms && pnpm --filter @email-hub/web lint

      - name: Prettier format check
        run: cd cms && pnpm --filter @email-hub/web format:check

      - name: Type check
        run: cd cms && pnpm --filter @email-hub/web type-check

      - name: Test
        run: cd cms && pnpm --filter @email-hub/web test

  sdk-check:
    name: SDK drift detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install Python deps
        run: uv sync --frozen

      - name: Export OpenAPI spec (live fetch)
        # --live boots uvicorn and fetches /openapi.json over HTTP so the
        # snapshot reflects middleware/lifespan-injected schema state, not
        # just app.openapi() on the in-process app object.
        #
        # Feature flags align with the committed SDK's generation context:
        # - CREDENTIALS__ENABLED: mounts the credentials/health routers
        # - AI__PROMPT_STORE_ENABLED=false: skips the prompt-store DB preload
        #   that the lifespan would otherwise attempt (no Postgres in this job)
        # - COLLAB_WS__ENABLED=false: skips the Redis-bound collab manager
        env:
          CREDENTIALS__ENABLED: "true"
          AI__PROMPT_STORE_ENABLED: "false"
          COLLAB_WS__ENABLED: "false"
        run: uv run python scripts/export-openapi.py --live

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node deps
        run: cd cms && pnpm install --frozen-lockfile

      - name: Generate SDK from snapshot
        run: cd cms && pnpm --filter @email-hub/sdk generate-sdk

      - name: Check for drift
        run: |
          if ! git diff --quiet cms/packages/sdk/; then
            echo "::error::SDK is out of date. Run 'make sdk-snapshot && make sdk-local' and commit."
            git diff --stat cms/packages/sdk/
            git diff cms/packages/sdk/
            exit 1
          fi
          echo "SDK is up to date."

  trivy:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build app image
        run: docker build -t email-hub:ci .

      - name: Build db image
        run: docker build -t email-hub-db:ci -f db/Dockerfile db/

      - name: Trivy scan — app
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: email-hub:ci
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Trivy scan — db
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: email-hub-db:ci
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

  migrations:
    name: Migration safety (alembic upgrade + check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE__URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      # AUTH__JWT_SECRET_KEY needs ≥32 chars (Field(min_length=32) — Phase 1a).
      # ENVIRONMENT must not be 'production' or sentinels in app/core/config.py:910-916 trip.
      AUTH__JWT_SECRET_KEY: test-secret-for-ci-not-a-real-key-32chars
      AUTH__DEMO_USER_PASSWORD: ci-not-admin
      AUTH_SECRET: test-secret-for-ci-not-a-real-key-32chars
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: alembic check (model ↔ schema parity)
        # Promoted to a hard gate after `normalize_schema_drift` reconciled
        # the long-standing TIMESTAMP/NOT NULL/comment drift and env.py
        # gained the include_object filter for redundant PK indexes.
        run: uv run alembic check

  integration:
    name: Integration tests (tenant isolation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # `app/tests/conftest.py::_integration_engine` runs `alembic upgrade head`
      # itself on session start — no separate migrate step required here.
      TEST_DATABASE__URL: postgresql+asyncpg://postgres:postgres@localhost:5433/test
      DATABASE__URL: postgresql+asyncpg://postgres:postgres@localhost:5433/test
      AUTH__JWT_SECRET_KEY: test-secret-for-ci-not-a-real-key-32chars
      AUTH__DEMO_USER_PASSWORD: ci-not-admin
      AUTH_SECRET: test-secret-for-ci-not-a-real-key-32chars
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Tenant isolation regression
        run: uv run pytest app/tests/test_tenant_isolation.py -v

  migration-lint:
    name: Migration safety (squawk)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install squawk
        run: |
          curl -fL https://github.com/sbdchd/squawk/releases/latest/download/squawk-linux-x64 -o /usr/local/bin/squawk
          chmod +x /usr/local/bin/squawk
          squawk --version

      - name: Lint changed migrations (advisory)
        # squawk only parses raw SQL — it cannot read alembic Python migrations
        # (every `op.execute("...")` body becomes a syntax error and the job
        # exits 123). Until a Python-aware migration linter is wired up
        # (tracked in deferred-items::tech-debt-squawk-python-migrations),
        # this step runs as advisory: it surfaces issues for SQL-file
        # migrations but does not block PRs that change Python migrations.
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- 'alembic/versions/*.py' || true)
          if [ -n "$CHANGED" ]; then
            echo "Linting migrations: $CHANGED"
            echo "$CHANGED" | xargs squawk --reporter=tty
          else
            echo "No migration changes detected."
          fi

  commit-lint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check conventional commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          COMMITS=$(git log --no-merges --format='%s' "origin/$BASE_REF..HEAD")
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+'
          FAILED=0
          while IFS= read -r msg; do
            if [[ ! "$msg" =~ $PATTERN ]]; then
              echo "FAIL: $msg"
              FAILED=1
            fi
          done <<< "$COMMITS"
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Commit messages must follow conventional commits: type(scope): description"
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "All commit messages follow conventional commit format."

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE__URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS__URL: redis://localhost:6379/0
      # AUTH__JWT_SECRET_KEY must be ≥32 chars (Field(min_length=32) added in
      # Phase 1a JWT entropy work — app/core/config.py:32).
      AUTH__JWT_SECRET_KEY: test-secret-for-ci-not-a-real-key-32chars
      AUTH_SECRET: test-secret-for-ci-not-a-real-key-32chars
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cms/pnpm-lock.yaml

      - name: Install Node dependencies
        run: cd cms && pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: cd cms/apps/web && pnpm exec playwright install --with-deps chromium

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Seed E2E admin user
        run: |
          uv run python - <<'PY'
          import asyncio
          from sqlalchemy import select, text
          from app.auth.models import User
          from app.auth.service import AuthService
          from app.core.config import get_settings
          from app.core.database import AsyncSessionLocal, engine

          async def main() -> None:
              password = get_settings().auth.demo_user_password
              hashed = AuthService.hash_password(password)
              async with AsyncSessionLocal() as db:
                  # The migration inserts the system user with explicit id=1 without
                  # advancing users_id_seq. Advance it so our INSERT allocates id>=2.
                  await db.execute(
                      text("SELECT setval('users_id_seq', GREATEST((SELECT MAX(id) FROM users), 1))")
                  )
                  existing = (
                      await db.execute(select(User).where(User.email == "admin@email-hub.dev"))
                  ).scalar_one_or_none()
                  if existing is None:
                      db.add(
                          User(
                              email="admin@email-hub.dev",
                              hashed_password=hashed,
                              name="Admin",
                              role="admin",
                          )
                      )
                      await db.commit()
                      print("E2E admin created")
                  else:
                      existing.hashed_password = hashed
                      await db.commit()
                      print("E2E admin password refreshed")
              await engine.dispose()

          asyncio.run(main())
          PY

      - name: Start backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8891 &
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8891/health; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend failed to start within 60s"
          exit 1

      - name: Run smoke E2E tests
        run: cd cms && pnpm --filter web e2e:smoke

      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: playwright-traces
          path: |
            cms/apps/web/test-results/
            cms/apps/web/playwright-report/
          retention-days: 7

  # CodeQL, ported from the taxi repo (f2cc6c4, ci.yml `codeql` job). The repo
  # is public, so code scanning is free. The upload gives the alerts tab and
  # the PR annotations; the GATE is .github/scripts/codeql-gate.sh, which reads
  # the CodeQL alerts GitHub produced from this upload and fails when the PR
  # adds a high/critical (or error-level) alert the base does not carry. The
  # "Code scanning results" check GitHub adds on its own is a check run outside
  # this workflow, which `ready.needs` cannot see. Default setup must stay off:
  # GitHub rejects an advanced-setup SARIF while default setup is on. On push
  # to main this job is the baseline the PR gate diffs against; the gate step
  # itself is PR-only. One job for all three languages, not a matrix: the gate
  # must run after every language's upload has been processed. `actions` keeps
  # the coverage default setup had.
  codeql:
    name: CodeQL (analyze + gate)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF; also reads the alerts
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: python, javascript-typescript, actions
          build-mode: none
          # `security-extended` adds lower-precision security queries; NOT
          # `security-and-quality`, whose maintainability rules are not
          # security findings and would still block a PR through the gate's
          # `rule.severity == "error"` branch.
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/.next'
              - '**/dist'
              - '**/coverage'
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          upload: always
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/codeql-gate.sh --pr "$PR" --base "$GITHUB_BASE_REF"

  # The only path from draft to ready, ported from the taxi repo (f2cc6c4,
  # ci.yml `ready` job). Agents open PRs as drafts; the Claude Code PreToolUse
  # hook (.claude/hooks/pre_tool_use.py, added with the AI layer) refuses
  # `gh pr ready` by matching command text, so it makes the flip deliberate,
  # not impossible. The control that holds is branch protection on `main`.
  # Marking a PR ready in the GitHub UI is the human bypass. Red anywhere in
  # `needs` converts the PR back to a draft. `!cancelled()` rather than
  # `always()`: a cancelled run must not touch the PR; the run that cancelled
  # it will. Semgrep lives in semgrep.yml, which `needs` cannot reach; it is
  # advisory (`continue-on-error`) and deliberately not a required check.
  #
  # What ready means, exactly: THE HEAD CI LAST FINISHED TESTING PASSED, not
  # "the PR's current head passed". Between a push and that head's run reaching
  # this job, the PR keeps the state the previous head earned. Nothing
  # re-drafts on `synchronize`, by choice: a job that re-drafted every push
  # would undo a human's manual ready before any gate result existed. Required
  # status checks on main (`strict: true`) will close that window, not this job.
  #
  # Dependabot PRs are skipped: they merge through dependabot-auto-merge.yml,
  # which needs the whole CI workflow to succeed. Dependabot-triggered runs
  # get Dependabot secrets, not Actions secrets (GitHub docs; `expected`, not
  # observed here), so PR_READY_TOKEN would be empty there. A skipped job does
  # not fail the workflow.
  #
  # The token is a CLASSIC `repo`-scope PAT in the PR_READY_TOKEN secret, not
  # github.token and not a fine-grained PAT. On taxi the draft/ready mutations
  # refused both (observed there 2026-09-10: "Resource not accessible by
  # integration" with github.token under `pull-requests: write`; "Resource not
  # accessible by personal access token" with a fine-grained token); the
  # classic token flipped it. A missing secret fails this job, so the PR stays
  # a draft: fail closed. A PAT's events CAN start workflows, unlike
  # github.token's, but `ready_for_review` and `converted_to_draft` are not in
  # `pull_request`'s default activity types, so no run follows.
  ready:
    name: Ready for review
    needs: [backend, frontend, sdk-check, trivy, migrations, integration, migration-lint, commit-lint, e2e-smoke, codeql]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PR_READY_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      RESULTS: ${{ join(needs.*.result, ' ') }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # A stale re-run must not decide a newer head's draft state. `gh run
      # rerun` on an older run replays the ORIGINAL event payload, so it
      # re-tests the old head's merge commit, joins this PR's concurrency group,
      # cancels the live run for the new head, and would then flip the PR at a
      # head it never tested. Compare and refuse; the newer head's own run
      # decides.
      - name: Refuse to act on a head that is no longer the PR's
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PR_READY_TOKEN is not set; PR #$PR stays a draft (fail closed)."
            exit 1
          fi
          live=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "::error::this run tested $HEAD_SHA but PR #$PR is now at $live; leaving its draft state alone."
            exit 1
          fi
          echo "head confirmed: $HEAD_SHA"
      - name: Flip draft state from the gate results
        run: |
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*)
              gh pr ready --undo --repo "$GITHUB_REPOSITORY" "$PR"
              echo "::error::gate results: $RESULTS. PR #$PR stays a draft."
              exit 1 ;;
            *)
              gh pr ready --repo "$GITHUB_REPOSITORY" "$PR" ;;
          esac
